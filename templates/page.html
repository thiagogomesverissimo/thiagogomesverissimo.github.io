<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - {{ profile.nome }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #333;
            background-color: #ffffff;
            padding-top: 70px;
        }
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e9ecef;
        }
        .navbar-brand {
            font-weight: 700;
            color: #495057;
            font-size: 1.25rem;
        }
        .profile-img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .profile-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #212529;
        }
        .sidebar-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-links li {
            margin-bottom: 8px;
        }
        .sidebar-links a {
            color: #6c757d;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-links a:hover {
            color: #0d6efd;
        }
        .page-title {
            font-weight: 700;
            font-size: 2rem;
            color: #212529;
            margin-bottom: 10px;
        }
        .page-date {
            font-size: 0.9rem;
            color: #6c757d;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .markdown-body img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin: 15px 0;
        }
        pre {
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar com botão de Voltar -->
    <nav class="navbar navbar-expand-md navbar-light fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{{ relative_root }}index.html">{{ profile.nome }}</a>
            <a href="{{ relative_root }}index.html" class="btn btn-sm btn-outline-secondary">← Voltar para a Inicial</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            
            <!-- Barra Lateral -->
            <div class="col-md-3 mb-4">
                <div class="sticky-top" style="top: 90px;">
                    {% if profile.foto %}
                    <img src="{{ relative_root }}{{ profile.foto }}" alt="{{ profile.nome }}" class="profile-img">
                    {% endif %}
                    <div class="profile-name">{{ profile.nome }}</div>
                    
                    <ul class="sidebar-links">
                        {% for link in profile.links %}
                        <li>
                            <a href="{{ link.url }}" target="_blank">
                                <i class="{{ link.icone }}"></i> {{ link.rotulo }}
                            </a>
                        </li>
                        {% endfor %}
                    </ul>
                </div>
            </div>

            <!-- Conteúdo do Post / Página -->
            <div class="col-md-9">
                <article class="mb-5">
                    {% if page.date %}
                    <div class="page-date">{{ page.date }}</div>
                    {% endif %}
                    <h1 class="page-title">{{ page.title }}</h1>
                    <hr class="mb-4">
                    <div class="markdown-body">
                        {{ page.content | safe }}
                    </div>
                </article>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
</body>
</html>
